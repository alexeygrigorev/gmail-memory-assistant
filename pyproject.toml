[project]
name = "gmail-memory-assistant"
version = "0.1.0"
description = "AI agent with long-term memory — pydantic-ai + VectorAI DB"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]",
    "actian-vectorai-client",
    "sentence-transformers",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

# Resolution cutoff, so uv.lock reproduces the environment this project was
# migrated from regardless of any user-level uv config (which sets a rolling
# `exclude-newer = "7 days"` that cannot see pydantic-ai-slim 2.54.0 yet).
# Bump or remove it when you next upgrade dependencies (`uv lock --upgrade`).
[tool.uv]
# This is an application, not a library: never build or install the project
# itself, just its dependencies into .venv.
package = false
exclude-newer = "2026-10-06T00:00:00Z"
