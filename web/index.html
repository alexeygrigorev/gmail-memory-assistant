<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Chat</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark">🧠</span>
        <span class="brand-name">Memory Chat</span>
      </div>
      <div class="session">
        <input id="session" value="web" spellcheck="false" aria-label="Session name" />
        <button id="new-chat" title="Drop this conversation's history">New chat</button>
      </div>
    </header>

    <main id="chat">
      <div class="empty">🧠</div>
    </main>

    <footer>
      <form id="form">
        <input
          id="input"
          placeholder="Message…"
          autocomplete="off"
          autofocus
        />
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </form>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
